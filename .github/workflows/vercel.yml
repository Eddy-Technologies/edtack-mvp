name: Deploy to Vercel

on: push

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 'Deploy to Vercel'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/studywitheddy' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Verify Secrets Availability
        run: |
          echo "GOOGLE_TAG_MANAGER_ID is set: ${{ secrets.GOOGLE_TAG_MANAGER_ID != '' }}"
          echo "NUXT_PUBLIC_SUPABASE_URL is set: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL != '' }}"
          echo "NUXT_PUBLIC_SUPABASE_KEY is set: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY != '' }}"
          echo "NUXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY is set: ${{ secrets.NUXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "JWT_SECRET is set: ${{ secrets.JWT_SECRET != '' }}"
          echo "NUXT_STRIPE_SECRET_KEY is set: ${{ secrets.NUXT_STRIPE_SECRET_KEY != '' }}"
          echo "NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is set: ${{ vars.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY != '' }}"
          echo "NUXT_PUBLIC_STRIPE_PRICING_TABLE_ID is set: ${{ vars.NUXT_PUBLIC_STRIPE_PRICING_TABLE_ID != '' }}"
          echo "NUXT_PUBLIC_GOOGLE_CLIENT_ID is set: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID != '' }}"
          echo "NUXT_STRIPE_WEBHOOK_SECRET is set: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET != '' }}"
          echo "NUXT_PUBLIC_BASE_URL is set: ${{ vars.NUXT_PUBLIC_BASE_URL != '' }}"
          echo "NUXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL is set: ${{ vars.NUXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL != '' }}"
          echo "NUXT_PUBLIC_CHAT_WS_URL is set: ${{ secrets.NUXT_PUBLIC_CHAT_WS_URL != '' }}"
          echo "NUXT_PUBLIC_PYTHON_API_URL is set: ${{ secrets.NUXT_PUBLIC_PYTHON_API_URL != '' }}"

      - name: Pull Vercel Environment Information (Production)
        if: github.ref == 'refs/heads/studywitheddy'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Information (Preview)
        if: github.ref != 'refs/heads/studywitheddy'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project (Production)
        if: github.ref == 'refs/heads/studywitheddy'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          GOOGLE_TAG_MANAGER_ID: ${{ secrets.GOOGLE_TAG_MANAGER_ID }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          NUXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NUXT_STRIPE_SECRET_KEY: ${{ secrets.NUXT_STRIPE_SECRET_KEY }}
          NUXT_STRIPE_WEBHOOK_SECRET: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}
          NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NUXT_PUBLIC_STRIPE_PRICING_TABLE_ID: ${{ vars.NUXT_PUBLIC_STRIPE_PRICING_TABLE_ID }}
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_BASE_URL: ${{ vars.NUXT_PUBLIC_BASE_URL }}
          NUXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.NUXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL }}
          NUXT_PUBLIC_CHAT_WS_URL: ${{ secrets.NUXT_PUBLIC_CHAT_WS_URL }}
          NUXT_PUBLIC_PYTHON_API_URL: ${{ secrets.NUXT_PUBLIC_PYTHON_API_URL }}

      - name: Build Project (Preview)
        if: github.ref != 'refs/heads/studywitheddy'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          GOOGLE_TAG_MANAGER_ID: ${{ secrets.GOOGLE_TAG_MANAGER_ID }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          NUXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NUXT_STRIPE_SECRET_KEY: ${{ secrets.NUXT_STRIPE_SECRET_KEY }}
          NUXT_STRIPE_WEBHOOK_SECRET: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}
          NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NUXT_PUBLIC_STRIPE_PRICING_TABLE_ID: ${{ vars.NUXT_PUBLIC_STRIPE_PRICING_TABLE_ID }}
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_BASE_URL: ${{ vars.NUXT_PUBLIC_BASE_URL }}
          NUXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.NUXT_PUBLIC_STRIPE_CUSTOMER_PORTAL_URL }}
          NUXT_PUBLIC_CHAT_WS_URL: ${{ secrets.NUXT_PUBLIC_CHAT_WS_URL }}
          NUXT_PUBLIC_PYTHON_API_URL: ${{ secrets.NUXT_PUBLIC_PYTHON_API_URL }}

      - name: Deploy to Vercel (Production)
        id: deploy-prod
        if: github.ref == 'refs/heads/studywitheddy'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel (Preview)
        id: deploy-preview
        if: github.ref != 'refs/heads/studywitheddy'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Set Deployment URL
        id: deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/studywitheddy" ]; then
            echo "url=${{ steps.deploy-prod.outputs.url }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ steps.deploy-preview.outputs.url }}" >> $GITHUB_OUTPUT
          fi

      - name: Output Deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
